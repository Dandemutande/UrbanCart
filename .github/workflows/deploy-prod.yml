name: Deploy Production Website

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy-prod:
    environment:
      name: production
      url: https://dandemutande.github.io/urbancart/

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          mkdir public
          cp -r Website/* public/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
